# Example GitLab CI job: run ckb headless and keep .ckb/ as an artifact.
# Include from .gitlab-ci.yml. Adding this job is the project owner's authorization ("ci-implicit").
# Requires a masked CI/CD variable ANTHROPIC_API_KEY. Pin the image digest you trust.
ckb:
  image: node:22-bookworm-slim   # pin by digest in production: node:22-bookworm-slim@sha256:...
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    CI: "true"
    CKB_HOME: "$CI_PROJECT_DIR/.ckb-home"
    GIT_DEPTH: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 >/dev/null
    - npm install -g @anthropic-ai/claude-code --ignore-scripts
    - git -c core.hooksPath=/dev/null clone --depth 1 https://github.com/RndU53r/Code-Knowledge-Builder /tmp/ckb
  script:
    - claude -p "/ckb:full ." --plugin-dir /tmp/ckb --permission-mode acceptEdits --max-turns 400 --allowedTools "Read,Grep,Glob,Write,Edit,Agent,Skill,Bash(python3:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*)"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ckb/
