apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-api
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://oauth2-proxy.shop.svc/oauth2/auth"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  tls:
    - hosts: [shop.example.com]
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            backend:
              service:
                name: shop-api
                port:
                  number: 80
